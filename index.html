<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Feierabend Rechner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: eine schmale Spalte. Oben die Ergebniszeit gross, darunter Fortschritt, darunter die Eingaben. */
:root {
  --bg: #f1f5f4;
  --surface: #ffffff;
  --fg: #13201e;
  --muted: #587070;
  --line: #d3dedc;
  --accent: #0d7a69;
  --accent-fg: #ffffff;
  --track: #dce8e6;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1413;
    --surface: #152120;
    --fg: #e4efed;
    --muted: #8fa6a3;
    --line: #263836;
    --accent: #3cc6ac;
    --accent-fg: #05201a;
    --track: #223432;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1413;
  --surface: #152120;
  --fg: #e4efed;
  --muted: #8fa6a3;
  --line: #263836;
  --accent: #3cc6ac;
  --accent-fg: #05201a;
  --track: #223432;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main {
  max-width: 440px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
h1 {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-wrap: balance;
}
.result {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.label {
  font-size: 0.75rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.leave {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
  font-size: clamp(3.4rem, 22vw, 5rem);
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--accent);
}
.leave small {
  font-size: 0.9rem;
  letter-spacing: 0;
  color: var(--muted);
  margin-left: 6px;
}
.status {
  font-size: 1.05rem;
  font-weight: 500;
  min-height: 1.5em;
}
.bar {
  height: 10px;
  border-radius: 999px;
  background: var(--track);
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 999px;
  transition: width 0.6s ease;
}
.stats {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 0.85rem;
  color: var(--muted);
}
.inputs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
}
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field input {
  font: inherit;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: 1.2rem;
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  width: 100%;
  min-width: 0;
}
.field input:focus-visible,
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  font: inherit;
  font-weight: 500;
  font-size: 0.9rem;
  color: var(--accent);
  background: transparent;
  border: 1px solid var(--accent);
  border-radius: 999px;
  padding: 8px 14px;
  cursor: pointer;
}
button:hover { background: var(--accent); color: var(--accent-fg); }
.hint { margin: 0; font-size: 0.8rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) {
  .bar > i { transition: none; }
}
</style>

<main>
  <h1>Feierabend Rechner</h1>

  <section class="result" aria-live="polite">
    <div class="label">Du kannst gehen um</div>
    <div class="leave"><span id="leave">--:--</span><small id="dayplus" hidden>nächster Tag</small></div>
    <div class="status" id="status">&nbsp;</div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="barwrap"><i id="bar"></i></div>
    <div class="stats">
      <span id="done">gearbeitet 0:00</span>
      <span id="total">Soll 8:30</span>
    </div>
  </section>

  <section class="inputs">
    <div class="field">
      <label class="label" for="arrive">Gekommen</label>
      <input id="arrive" type="time" value="09:30">
    </div>
    <div class="field">
      <label class="label" for="req">Arbeitszeit</label>
      <input id="req" type="time" value="08:30">
    </div>
    <div class="field">
      <label class="label" for="brk">Pause (Min)</label>
      <input id="brk" type="number" min="0" max="240" step="5" value="0" inputmode="numeric">
    </div>
  </section>

  <div class="actions">
    <button type="button" id="nowbtn">Jetzt eintragen</button>
    <button type="button" id="b30">+30 Min Pause</button>
  </div>
  <p class="hint">Arbeitszeit ist die Soll-Dauer pro Tag. Die Pause zählt zur Gehzeit dazu, wenn sie unbezahlt ist.</p>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = "feierabend-v1";

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || "null");
      if (s) {
        if (s.a) $("arrive").value = s.a;
        if (s.r) $("req").value = s.r;
        if (s.b !== undefined) $("brk").value = s.b;
      }
    } catch (e) {}
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        a: $("arrive").value, r: $("req").value, b: $("brk").value
      }));
    } catch (e) {}
  }

  function toMin(v) {
    if (!v || v.indexOf(":") < 0) return null;
    var p = v.split(":");
    var h = parseInt(p[0], 10), m = parseInt(p[1], 10);
    if (isNaN(h) || isNaN(m)) return null;
    return h * 60 + m;
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function clock(min) {
    var t = ((min % 1440) + 1440) % 1440;
    return pad(Math.floor(t / 60)) + ":" + pad(t % 60);
  }
  function dur(sec) {
    sec = Math.max(0, Math.round(sec / 60));
    var h = Math.floor(sec / 60), m = sec % 60;
    return h + ":" + pad(m);
  }
  function words(sec) {
    var min = Math.max(0, Math.ceil(sec / 60));
    var h = Math.floor(min / 60), m = min % 60;
    if (h === 0) return m + " Min";
    return h + " Std " + m + " Min";
  }

  function update() {
    var a = toMin($("arrive").value);
    var r = toMin($("req").value);
    var b = parseInt($("brk").value, 10);
    if (isNaN(b) || b < 0) b = 0;

    if (a === null || r === null) {
      $("leave").textContent = "--:--";
      $("dayplus").hidden = true;
      $("status").textContent = "Bitte Zeiten eintragen.";
      $("bar").style.width = "0%";
      return;
    }

    var leaveMin = a + r + b;
    $("leave").textContent = clock(leaveMin);
    $("dayplus").hidden = leaveMin < 1440;
    $("total").textContent = "Soll " + dur(r * 60) + (b ? " + " + b + " Min Pause" : "");

    var d = new Date();
    var nowSec = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
    var startSec = a * 60;
    var leaveSec = leaveMin * 60;
    var remaining = leaveSec - nowSec;
    var span = leaveSec - startSec;
    var worked = Math.min(Math.max(nowSec - startSec - 0, 0), span);
    var pct = span > 0 ? Math.min(100, Math.max(0, (nowSec - startSec) / span * 100)) : 0;

    $("bar").style.width = pct.toFixed(1) + "%";
    $("barwrap").setAttribute("aria-valuenow", Math.round(pct));
    $("done").textContent = "gearbeitet " + dur(Math.max(0, Math.min(nowSec - startSec, span) - 0));

    if (nowSec < startSec) {
      $("status").textContent = "Arbeit beginnt um " + clock(a) + ".";
    } else if (remaining > 0) {
      $("status").textContent = "Noch " + words(remaining) + ".";
    } else {
      $("status").textContent = "Feierabend. Seit " + words(-remaining) + " geschafft.";
    }
  }

  function onChange() { save(); update(); }
  ["arrive", "req", "brk"].forEach(function (id) {
    $(id).addEventListener("input", onChange);
  });
  $("nowbtn").addEventListener("click", function () {
    var d = new Date();
    $("arrive").value = pad(d.getHours()) + ":" + pad(d.getMinutes());
    onChange();
  });
  $("b30").addEventListener("click", function () {
    var b = parseInt($("brk").value, 10);
    $("brk").value = (isNaN(b) ? 0 : b) + 30;
    onChange();
  });

  load();
  update();
  setInterval(update, 1000);
})();
</script>

</body></html>
